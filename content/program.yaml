# Lightning talk schedule.
#
# Talk times are computed: talks run back to back from the session start,
# 5 minutes each, with each subsession's Q&A after its last talk.
# speakers are ids from people.yaml. Optional per talk: description.
# Optional per subsession: title, qa_minutes (default 5; 0 for none).
# Each session needs a type: lightning, presentation, meal, activity, general,
# or social (rendered as class "session-<type>" and data-type="<type>").
# Optional per session: end, organization (id from organizations.yaml),
# sponsor, location, description, image. Sessions without talks omit subsessions.
# image is a file name in public/images/ shown beside the session title, e.g.
#   image: eat.gif
# Without one, lightning, presentation and meal sessions get a default image
# (see DEFAULT_SESSION_IMAGES in lib/content.ts); other types get none.
