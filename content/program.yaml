  - name: Lightning Session 3
    type: lightning
    image: bolt-down.gif
    start: "11:00"
    end: "11:30"
    subsessions:
      - talks:
          - title: "Loafometry: Dimensions of Deliciousness"
            speakers: [ matt-mercurio ]
            description: |
              Bread loaf shape tells a lot about the loaf (and baker?) quality. The Pix4D Catch app is typically used for capturing geospatially accurate 3D models of assets using a smartphone and optionally a high accuracy GNSS receiver. Naturally, one may ask: Can 3D modeling help assess loaf quality for a single bake and over time? Luckily for yinz, the answer is yes. Going to show off some 3D models of some bread loaves captured using Pix4D Catch on my continuing journey from 0 to 100 loaves. Potentially attempt a live demo of capturing a 3D loaf model!
          - title: "GIS Beyond the Airfield: Bringing Airports Indoors"
            speakers: [ sydney-lytle ]
            description: |
              My lightning talk will be about the use of ArcGIS Indoors at Pittsburgh International Airport (PIT) and how it benefits our Facilities & Maintenance, and Lease & Space Management teams. Our trades teams can quickly search and find a unit that is identified in a work order, and our real estate team uses the system to identify vacant spaces and their square footages.
          - title: ArcGIS Indoors? a floor-aware indoor GIS map of all Pitt campus
            speakers: [ uma-gupta ]
            description: |
              This initiative creates a floor-aware indoor GIS map of all Pitt campus buildings by connecting existing AutoCAD floor plans to ArcGIS Online. Room polygons are attributed from ARCHIBUS (the space management system of record). The data model is designed to be compatible with ArcGIS Indoors when that license is acquired, and the work serves as a bridge until Revit becomes the authoring environment in 2027

              Our submission walks users through the process of automating georeferencing across hundreds of CAD drawings to encourage and simplify transition to ArcGIS Indoors, while demonstrating the value of this data management method for space teams via experience builder demo and seminar discussion.

