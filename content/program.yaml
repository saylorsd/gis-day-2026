  - name: Lightning Session 2
    type: lightning
    image: bolt-down.gif
    start: "10:15"
    end: "10:35"
    subsessions:
      - talks:
          - title: Mapping Pittsburgh Community Theaters
            speakers: [ caitlin-young ]
            description: |
              The Pittsburgh Community Theaters storymap serves as a way to connect people to community organizations that they can visit, participate in, or donate to. Initially created for the Community Theater Showcase at the Public Theater this spring, the map continues to be shared to drive growth for these organizations as people realize that there are arts opportunities in their backyard.

              StoryMap: https://storymaps.arcgis.com/stories/583130fc28124cea9cbf0b80fd9ec4f4
          - title: The Fayette ATLAS Project
            speakers: [ noah-held ]
            description: |
              Fay-Penn Economic Development Council works to strengthen Fayette County’s economy by supporting business growth, attracting investment, and promoting community development. Through partnerships with businesses, municipalities, and community organizations, Fay-Penn strives to improve the county’s economic opportunities and quality of life for its residents.
              Geographic Information Systems (GIS) supports this mission by organizing, analyzing, and visualizing geographic data to improve planning and decision-making. Over the past several months, I’ve developed maps and geospatial resources to support Fay-Penn’s initiatives. Our general county map highlights business parks, property locations, nature parks, state game lands, roadways, and municipalities, providing a valuable reference for economic development and planning.
              Beyond mapping, GIS helps identify opportunities, support grant applications, and improve access to information. The broader goal is to establish Fayette ATLAS as a collaborative GIS resource for municipalities, businesses, nonprofits, and regional partners.
              By strengthening data management, accessibility, and collaboration, Fayette ATLAS can reduce duplicated efforts, support informed decisions, and help promote sustainable economic growth throughout Fayette County.
          - title: Carnegie Mellon University Arboretum Tour
            speakers: [ taki-dai ]
            description: |
              This lightning talk presents Carnegie Mellon University Arboretum Tour, an ArcGIS StoryMap exploring Gates Garden, Pollinator Garden, and Peace Garden. The tour begins with an overview map of the three gardens, then allows visitors to select individual trees and learn about them through photographs and species profiles. Each profile introduces the tree’s common and scientific names, origins, preferred habitat, identifying features, ecological roles, and cultural uses. These details connect what visitors see on campus with stories they might otherwise miss. For example, quaking aspens can share an underground root system, while eastern white pines provide food for birds and small mammals. The paperbark maple’s peeling, cinnamon-colored bark gives visitors something distinctive to look for on their next walk. By connecting these stories to specific locations, the project helps students, staff, and visitors recognize trees they may pass every day. Visitors can explore the gardens online or use the maps to guide their own campus walks. The presentation will demonstrate how interactive mapping and plant stories come together to make the Arboretum’s collection easier to explore and encourage people to look more closely at familiar campus spaces.

