  - name: Lightning Session 1
    type: lightning
    image: bolt-down.gif
    start: "09:15"
    end: "09:45"
    subsessions:
      - talks:
          - title: Urban Studies Applied GIS Student Survey
            speakers: [ skylar-roth ]
            description: |
              Lightning Talk to detail Applied GIS student survey (bench/seating and receptacles) for Offices of Planning, Design, and Construction. How surveys were created, obstacles, and future work with data.
          - title: "Teaching GeoAI: Building Foundations for Spatial Judgment"
            speakers: [ suzy-li ]
            description: |
              How can a GeoAI course prepare students to tackle spatial questions beyond those covered in class? This lightning talk shares my approach to teaching GeoAI: Advanced GIS for Policy and Design at Carnegie Mellon University.

              The course builds foundations in raster analysis, remote sensing, basic statistics, and machine learning. Students learn transferable workflows that they can independently research, adapt, and extend. An NDVI exercise, for example, provides a starting point for exploring other spectral indices relevant to their projects. Flexible assignment options accommodate different technical backgrounds and interests while supporting shared learning goals.

              Examples from seven student projects illustrate how students apply and extend these approaches to challenges including accessible navigation, urban heat, and infrastructure impacts. Throughout, the course emphasizes spatial judgment: asking useful questions, choosing appropriate tools, checking what models reveal or miss, and recognizing where human and community knowledge must guide consequential policy and design decisions.
      - talks:
          - title: Who Let the Heat Out? Campus Growth and Neighborhood Warming Across Twelve Pittsburgh Institutions
            speakers: [ stuti-garg, yash-shah ]
            description: |
              Large hospital and university campuses grow inside older Pittsburgh neighborhoods, yet the city’s Institutional Master Plan review has no spatial record of how that growth affects local heat. We asked whether twelve Educational and Medical Institution campuses warmed relative to the city between 2015 and 2025, whether warming reached adjacent blocks, and whether hospitals and universities differ. Using 13,990 one-hectare hexagons, two Landsat scenes, and city-relative surface temperature anomalies, we modeled change with generalized linear regression, Moran’s I, and Getis-Ord hot spots, and classified one-meter NAIP imagery into canopy, grass, building, and pavement with a support vector machine. Institutional campuses did not warm as a class, which rejected our hypothesis, but hospital campuses behaved like ordinary urban land and sat 0.56 to 0.78°C warmer than universities across all three distance bands. Hospitals are warm because they are already bare, not because they are clearing trees. We treat the result as a screening aid for Master Plan review, with human verification, and propose image embeddings to scale the approach to other cities.
          - title: New spatial features on the WPRDC
            speakers: [ steve-saylor ]
            description: |
              This talk will cover new geospatial features available at the Western PA Regional Data Center (WPRDC).  Learn how to use our tile server to performantly render large local datasets in your maps and how to make PostGIS spatial queries against the WPRDC datasets in the API.

